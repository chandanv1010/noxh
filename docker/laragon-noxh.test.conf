<VirtualHost *:80>
    ServerName noxh.test
    ServerAlias *.noxh.test
    DocumentRoot "D:/sandbox/noxh/public"

    <Directory "D:/sandbox/noxh/public">
        Options +Indexes +Includes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "D:/sandbox/noxh/storage/logs/apache-error.log"
    CustomLog "D:/sandbox/noxh/storage/logs/apache-access.log" combined
</VirtualHost>

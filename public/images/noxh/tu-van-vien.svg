<?xml version="1.0" encoding="UTF-8"?>
<!--
    Anh minh hoa nguoi tu van, dung khi quan tri chua tai anh that len.

    Ve phang bang duong SVG chu khong dung anh chup: file nam trong git nen
    khong bien mat khi trien khai, va nhe hon anh chup vai chuc lan. Nguoi
    duoc ve NGHIENG mot chut va cat ngang nguc de dat sat mep phai cua
    banner giong bo cuc trong ban thiet ke.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360"
     role="img" aria-label="Minh hoạ chuyên viên tư vấn">
    <defs>
        <clipPath id="nx-tv-cat">
            <rect x="0" y="0" width="300" height="360"/>
        </clipPath>
    </defs>

    <g clip-path="url(#nx-tv-cat)">
        <!-- than nguoi: ao vest xanh than -->
        <path d="M150 360 v-92 c0-34 24-60 58-70 l34-10 34 10 c34 10 58 36 58 70 v92 Z"
              fill="#1e3a68" transform="translate(-92 0)"/>

        <!-- co ao so mi trang -->
        <path d="M128 198 l22 10 -22 46 -14 -40 Z" fill="#ffffff"/>
        <path d="M172 198 l-22 10 22 46 14 -40 Z" fill="#ffffff"/>
        <path d="M150 208 l-8 14 8 62 8 -62 Z" fill="#1462c4"/>

        <!-- ve ao ben ngoai -->
        <path d="M126 196 l-26 12 c-20 10 -32 30 -32 54 v98 h34 l14 -110 Z" fill="#274d84"/>
        <path d="M174 196 l26 12 c20 10 32 30 32 54 v98 h-34 l-14 -110 Z" fill="#274d84"/>

        <!-- co -->
        <path d="M132 172 h36 v32 c0 10 -36 10 -36 0 Z" fill="#e9b28c"/>

        <!-- Toc ve TRUOC khuon mat: mot khoi tron to hon dau mot chut, dat
             cao hon 12 don vi. Phan lo ra phia tren va hai ben chinh la toc,
             nen khong phai ve them duong mai - duong mai ve tay de sinh mui
             nhon tho ra ngoai khoi toc. -->
        <ellipse cx="150" cy="113" rx="43" ry="49" fill="#22252e"/>

        <!-- dau -->
        <ellipse cx="150" cy="126" rx="39" ry="45" fill="#f2c39d"/>
        <!-- tai -->
        <ellipse cx="111" cy="130" rx="7" ry="10" fill="#e9b28c"/>
        <ellipse cx="189" cy="130" rx="7" ry="10" fill="#e9b28c"/>

        <!-- mat -->
        <ellipse cx="136" cy="126" rx="4" ry="5" fill="#2b2f3a"/>
        <ellipse cx="164" cy="126" rx="4" ry="5" fill="#2b2f3a"/>
        <path d="M128 116 q8 -6 16 -1" stroke="#2b2f3a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M156 115 q8 -5 16 1" stroke="#2b2f3a" stroke-width="3" fill="none" stroke-linecap="round"/>

        <!-- mieng cuoi -->
        <path d="M138 149 q12 11 24 0" stroke="#b9714f" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
</svg>

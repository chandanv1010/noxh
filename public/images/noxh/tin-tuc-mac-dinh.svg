<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Bài viết">
    <!--
        Anh thay the cho bai viet chua co anh dai dien.

        Ve bang SVG chu khong phai anh chup: nhe (vai tram byte), net o moi co
        man hinh, va doi mau theo bang mau cua website duoc ngay.
    -->
    <defs>
        <linearGradient id="nenTin" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e8f1fd"/>
            <stop offset="1" stop-color="#d7e8fb"/>
        </linearGradient>
    </defs>

    <rect width="160" height="160" fill="url(#nenTin)"/>

    <!-- To giay -->
    <g transform="translate(44 34)">
        <rect x="0" y="0" width="64" height="84" rx="6" fill="#ffffff"/>
        <rect x="11" y="13" width="42" height="7" rx="3.5" fill="#0a78f5"/>
        <rect x="11" y="28" width="42" height="4.5" rx="2.25" fill="#b9d5f6"/>
        <rect x="11" y="39" width="42" height="4.5" rx="2.25" fill="#b9d5f6"/>
        <rect x="11" y="50" width="28" height="4.5" rx="2.25" fill="#b9d5f6"/>
        <rect x="11" y="63" width="20" height="10" rx="3" fill="#dceafb"/>
    </g>

    <!-- Day nha phia sau, goi y chu de nha o -->
    <g fill="#0a78f5" opacity="0.18">
        <rect x="18" y="86" width="26" height="42" rx="3"/>
        <rect x="116" y="74" width="26" height="54" rx="3"/>
    </g>

    <rect x="0" y="126" width="160" height="34" fill="#c9e0fa" opacity="0.55"/>
</svg>
